name: In-page comments
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/inline-eval.mjs'
      - 'tests/inline-*'
      - 'build.mjs'
      - 'package*.json'
      - '.github/workflows/inline-comments.yml'
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_ORIGIN: https://web-comments-rysl.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev
      - run: npm run check
      - run: npm test
      - run: npx --no-install playwright-core install --with-deps chromium
      - run: node scripts/inline-eval.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: web-comments-chrome-extension
          path: dist/extension/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: in-page-evaluation
          path: dist/inline-evals/
